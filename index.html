<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serendipity</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: "Playfair Display", serif;

      background:
        radial-gradient(circle at 20% 20%, rgba(122, 54, 171, 0.45), transparent 28%),
        radial-gradient(circle at 80% 30%, rgba(91, 29, 140, 0.35), transparent 30%),
        radial-gradient(circle at 50% 80%, rgba(45, 14, 70, 0.55), transparent 32%),
        linear-gradient(135deg, #020107 0%, #090412 35%, #16051f 70%, #030106 100%);

      color: #f4ecff;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background-image:
        radial-gradient(circle at 8% 18%, rgba(255,255,255,0.95) 0 1px, transparent 1.8px),
        radial-gradient(circle at 18% 72%, rgba(210,178,255,0.8) 0 1.2px, transparent 2px),
        radial-gradient(circle at 31% 27%, rgba(255,255,255,0.75) 0 0.8px, transparent 1.8px),
        radial-gradient(circle at 44% 86%, rgba(190,142,255,0.9) 0 1px, transparent 2px),
        radial-gradient(circle at 57% 14%, rgba(255,255,255,0.85) 0 1.1px, transparent 2px),
        radial-gradient(circle at 68% 62%, rgba(220,194,255,0.9) 0 0.9px, transparent 1.9px),
        radial-gradient(circle at 76% 34%, rgba(255,255,255,0.7) 0 1px, transparent 1.8px),
        radial-gradient(circle at 88% 78%, rgba(200,160,255,0.85) 0 1.2px, transparent 2px);

      opacity: 0.6;
      pointer-events: none;
    }

    .shooting-star {
      position: fixed;
      width: 150px;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0), #fff, rgba(214,175,255,0.18));
      opacity: 0;
      transform: rotate(-25deg);
      animation: fall 6s linear infinite;
      filter: drop-shadow(0 0 6px rgba(230,210,255,0.8));
    }

    .shooting-star::after {
      content: "";
      position: absolute;
      right: 0;
      top: -2px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 12px rgba(235,220,255,0.9);
    }

    .shooting-star:nth-child(1) { top: 10%; left: 80%; animation-delay: 0s; }
    .shooting-star:nth-child(2) { top: 28%; left: 100%; animation-delay: 2s; }
    .shooting-star:nth-child(3) { top: 55%; left: 90%; animation-delay: 4s; }

    @keyframes fall {
      0% {
        transform: translate(0,0) rotate(-25deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      35% {
        opacity: 0;
      }

      100% {
        transform: translate(-520px,240px) rotate(-25deg);
        opacity: 0;
      }
    }

    .password-box {
      width: min(430px, 90vw);

      padding: 52px 40px;

      border-radius: 26px;

      background: rgba(10, 5, 18, 0.72);

      border: 1px solid rgba(255,255,255,0.12);

      backdrop-filter: blur(18px);

      text-align: center;

      box-shadow: 0 0 40px rgba(162,97,255,0.22);

      position: relative;
      z-index: 2;
    }

    .moon {
      font-size: 68px;
      margin-bottom: 18px;
      filter: drop-shadow(0 0 18px rgba(218,190,255,0.5));
    }

    h1 {
      font-size: 52px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    p {
      font-size: 14px;
      line-height: 1.8;
      opacity: 0.76;
      margin-bottom: 28px;
    }

    input {
      width: 100%;

      padding: 15px 18px;

      border-radius: 999px;

      border: 1px solid rgba(255,255,255,0.12);

      background: rgba(255,255,255,0.05);

      color: white;

      outline: none;

      font-family: "Playfair Display", serif;

      margin-bottom: 16px;
    }

    input::placeholder {
      color: rgba(255,255,255,0.55);
    }

    button {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 999px;

      background: rgba(138,74,221,0.7);

      color: white;

      cursor: pointer;

      font-family: "Cinzel", serif;

      letter-spacing: 2px;

      transition: 0.3s ease;
    }

    button:hover {
      background: rgba(162,97,255,0.85);
      transform: translateY(-2px);
    }

    #errorMessage {
      margin-top: 16px;
      font-size: 13px;
      opacity: 0.8;
      color: #f1d6ff;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>

  <div class="password-box">

    <div class="moon">☾</div>

    <h1>Serendipity</h1>

    <p>
      algumas histórias foram feitas
      para serem encontradas apenas por uma pessoa
    </p>

    <input
      type="password"
      id="passwordInput"
      placeholder="digite nossa senha ♡"
    >

    <button id="enterBtn">entrar</button>

    <div id="errorMessage"></div>

  </div>

  <script>
    const correctPassword = "abacaxi";

    const enterBtn = document.getElementById("enterBtn");
    const passwordInput = document.getElementById("passwordInput");
    const errorMessage = document.getElementById("errorMessage");

    function checkPassword() {

      if (passwordInput.value === correctPassword) {

        document.body.style.opacity = "0";

        setTimeout(() => {
          window.location.href = "livro.html";
        }, 800);

      } else {

        errorMessage.textContent = "Não acredito que você errou 😒";

      }
    }

    enterBtn.addEventListener("click", checkPassword);

    passwordInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>
</body>
</html>
